<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi perfil — Biohacker's Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
    <style>
        :root {
            --bg: #FAFAF7; --bg-elev: #FFFFFF; --bg-muted: #F1F2EC;
            --ink: #0F1419; --ink-soft: #3A414B; --ink-mute: #6B7280;
            --accent: #1F7A55; --accent-soft: #DCE9E1; --alert: #B3261E;
            --rule: #E5E5DE; --link: #166A47; --link-hover: #0F4730;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0A0E12; --bg-elev: #131820; --bg-muted: #1A212B; --ink: #E8EAED; --ink-soft: #B0B5BB; --ink-mute: #8A8F96; --accent: #4CC78A; --accent-soft: #1E2C26; --rule: #2A313C; --link: #4CC78A; --link-hover: #7ADBA6; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { width: 100%; max-width: 640px; padding: 40px; background: var(--bg-elev); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { margin: 0 0 8px; font-size: 24px; }
        p { margin: 0 0 24px; color: var(--ink-soft); font-size: 14px; }
        section { margin-bottom: 32px; }
        section h2 { font-size: 18px; margin-bottom: 12px; }
        ul { padding-left: 20px; }
        li { margin-bottom: 8px; }
        a { color: var(--link); text-decoration: none; }
        a:hover { text-decoration: underline; }
        button { padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
        button:hover { background: var(--link-hover); }
        .empty { color: var(--ink-mute); font-style: italic; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>Mi perfil</h1>
        <p id="user-email">Cargando...</p>
        <section>
            <h2>Notas guardadas</h2>
            <ul id="fav-list"><li class="empty">Cargando...</li></ul>
        </section>
        <section>
            <h2>Historial reciente</h2>
            <ul id="hist-list"><li class="empty">Cargando...</li></ul>
        </section>
        <section>
            <h2>Notas personales</h2>
            <ul id="annot-list"><li class="empty">Cargando...</li></ul>
        </section>
        <button id="logout-btn">Cerrar sesión</button>
    </div>
    <script type="module">
        import { onUserChanged, signOutUser } from './js/auth.js';
        import { getFavorites, getHistory, getAnnotations } from './js/db.js';

        // Decodificar slugs en base64url (misma lógica que user-features.js)
        function fromFirebaseKey(key) {
            try {
                const b64 = String(key || '').replace(/-/g, '+').replace(/_/g, '/');
                const padded = b64 + '='.repeat((4 - b64.length % 4) % 4);
                return decodeURIComponent(escape(atob(padded)));
            } catch (e) {
                return key;
            }
        }

        onUserChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            document.getElementById('user-email').textContent = user.email;
            const [favs, history, annotations] = await Promise.all([
                getFavorites().catch(() => ({})),
                getHistory().catch(() => ({})),
                getAnnotations().catch(() => ({}))
            ]);

            const favList = document.getElementById('fav-list');
            const favKeys = Object.keys(favs);
            favList.innerHTML = favKeys.length ? favKeys.map(k => { const d = fromFirebaseKey(k).replace(/\.html?$/, ''); return `<li><a href="${d}.html">${d}</a></li>`; }).join('') : '<li class="empty">No tienes notas guardadas.</li>';

            const histList = document.getElementById('hist-list');
            const histEntries = Object.entries(history).sort((a, b) => b[1] - a[1]).slice(0, 20);
            histList.innerHTML = histEntries.length ? histEntries.map(([k, ts]) => { const d = fromFirebaseKey(k).replace(/\.html?$/, ''); return `<li><a href="${d}.html">${d}</a> <small>${new Date(ts).toLocaleDateString()}</small></li>`; }).join('') : '<li class="empty">No hay historial reciente.</li>';

            const annotList = document.getElementById('annot-list');
            const annotEntries = Object.entries(annotations);
            annotList.innerHTML = annotEntries.length ? annotEntries.map(([k, text]) => { const d = fromFirebaseKey(k).replace(/\.html?$/, ''); return `<li><a href="${d}.html">${d}: ${text.slice(0, 80)}${text.length > 80 ? '...' : ''}</a></li>`; }).join('') : '<li class="empty">No tienes notas personales.</li>';
        });

        document.getElementById('logout-btn').addEventListener('click', async () => {
            await signOutUser();
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
