<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Biohacker's Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
    <style>
        :root {
            --bg: #FAFAF7; --bg-elev: #FFFFFF; --bg-muted: #F1F2EC;
            --ink: #0F1419; --ink-soft: #3A414B; --ink-mute: #6B7280;
            --accent: #1F7A55; --accent-soft: #DCE9E1; --alert: #B3261E;
            --rule: #E5E5DE; --link: #166A47; --link-hover: #0F4730;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0A0E12; --bg-elev: #131820; --bg-muted: #1A212B; --ink: #E8EAED; --ink-soft: #B0B5BB; --ink-mute: #8A8F96; --accent: #4CC78A; --accent-soft: #1E2C26; --rule: #2A313C; --link: #4CC78A; --link-hover: #7ADBA6; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .auth-card { width: 100%; max-width: 420px; padding: 40px; background: var(--bg-elev); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        h1 { margin: 0 0 8px; font-size: 24px; }
        p { margin: 0 0 24px; color: var(--ink-soft); font-size: 14px; }
        label { display: block; margin-bottom: 4px; font-size: 14px; color: var(--ink-soft); }
        input { width: 100%; padding: 12px; margin-bottom: 16px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); color: var(--ink); font-size: 15px; }
        button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:hover { background: var(--link-hover); }
        .error { color: var(--alert); font-size: 14px; margin-top: 12px; }
        .link { margin-top: 20px; text-align: center; font-size: 14px; }
        .link a { color: var(--link); text-decoration: none; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h1>Iniciar sesión</h1>
        <p>Accede a tus notas guardadas, historial y anotaciones.</p>
        <form id="login-form">
            <label for="email">Email</label>
            <input type="email" id="email" required autocomplete="email">
            <label for="password">Contraseña</label>
            <input type="password" id="password" required autocomplete="current-password">
            <button type="submit">Entrar</button>
            <div class="error" id="auth-error"></div>
        </form>
        <div class="link">¿No tienes cuenta? <a href="registro.html">Regístrate</a></div>
    </div>
    <script type="module">
        import { signIn } from './js/auth.js';
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await signIn(email, password);
                window.location.href = 'index.html';
            } catch (err) {
                document.getElementById('auth-error').textContent = err.message;
            }
        });
    </script>
</body>
</html>
