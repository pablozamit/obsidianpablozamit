<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso por invitación — Biohacker's Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
    <style>
        :root {
            --bg: #FAFAF7; --bg-elev: #FFFFFF; --bg-muted: #F1F2EC;
            --ink: #0F1419; --ink-soft: #3A414B; --ink-mute: #6B7280;
            --accent: #1F7A55; --accent-soft: #DCE9E1; --alert: #B3261E;
            --rule: #E5E5DE; --link: #166A47; --link-hover: #0F4730;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0A0E12; --bg-elev: #131820; --bg-muted: #1A212B; --ink: #E8EAED; --ink-soft: #B0B5BB; --ink-mute: #8A8F96; --accent: #4CC78A; --accent-soft: #1E2C26; --rule: #2A313C; --link: #4CC78A; --link-hover: #7ADBA6; }
        }
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .auth-card { width: 100%; max-width: 460px; padding: 40px; background: var(--bg-elev); border: 1px solid var(--rule); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); text-align: center; }
        .badge { display: inline-block; padding: 4px 10px; background: var(--accent-soft); color: var(--accent); font-size: 12px; font-weight: 600; border-radius: 999px; margin-bottom: 16px; letter-spacing: .02em; }
        h1 { margin: 0 0 16px; font-size: 22px; line-height: 1.3; }
        p { margin: 0 0 16px; color: var(--ink-soft); font-size: 15px; line-height: 1.5; }
        .email { display: inline-block; margin-top: 8px; padding: 10px 18px; background: var(--bg-muted); color: var(--ink); border-radius: 8px; font-family: var(--font-mono); font-size: 14px; text-decoration: none; border: 1px solid var(--rule); }
        .email:hover { background: var(--accent-soft); }
        .login-link { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--ink-soft); }
        .login-link a { color: var(--link); text-decoration: none; font-weight: 500; }
        .login-link a:hover { color: var(--link-hover); text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-card">
        <span class="badge">Solo por invitación</span>
        <h1>El registro público está cerrado</h1>
        <p>Esta membresía es de pago. Las cuentas solo las crea Pablo cuando confirmas tu suscripción.</p>
        <p>Si ya eres miembro y solo necesitas entrar:</p>
        <a class="email" href="mailto:hola@pablozamit.xyz?subject=Solicitud%20de%20acceso%20a%20Biohacker%27s%20Lab">hola@pablozamit.xyz</a>
        <div class="login-link">
            ¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a>
        </div>
    </div>
</body>
</html>
